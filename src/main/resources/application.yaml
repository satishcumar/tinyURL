spring:
  application:
    name: tinyurl
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false

tinyurl:
  base-url: ${TINYURL_BASE_URL:http://localhost:8080}

orchestration:
  artifact-root: ${ORCHESTRATION_ARTIFACT_ROOT:build/orchestration-runs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8080
